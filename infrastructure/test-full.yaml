AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: EMIP full test

Globals:
  Function:
    Timeout: 120
    MemorySize: 1024
    Runtime: python3.14
    Architectures: [x86_64]

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  LogLevel:
    Type: String
    Default: INFO
  DynamoDBJobsTable:
    Type: String
    Default: emip-jobs-dev
  DynamoDBAnalysisTable:
    Type: String
    Default: emip-analysis-dev
  ApiKey:
    Type: String
    Default: ""

Resources:
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "emip-api-${Environment}"
      StageName: !Ref Environment
      BinaryMediaTypes: ["*/*"]
      Cors:
        AllowMethods: "'*'"
        AllowHeaders: "'*'"
        AllowOrigin: "'*'"
      TracingEnabled: true
      Auth:
        DefaultAuthorizer: NONE
      MethodSettings:
        - HttpMethod: "*"
          ResourcePath: "/*"
          LoggingLevel: INFO
          DataTraceEnabled: false
          MetricsEnabled: true

  DependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "emip-deps-${Environment}"
      ContentUri: ../layers/dependencies/
      CompatibleRuntimes: [python3.14]

  ArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "emip-artifacts-${Environment}-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: CleanupOldAnalysis
            Status: Enabled
            Transitions:
              - TransitionInDays: 30
                StorageClass: GLACIER

  JobsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref DynamoDBJobsTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH

  AnalysisTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref DynamoDBAnalysisTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
        - AttributeName: analysis_type
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
        - AttributeName: analysis_type
          KeyType: RANGE

  AnalysisDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "emip-analysis-dlq-${Environment}"
      MessageRetentionPeriod: 1209600
      KmsMasterKeyId: alias/aws/sqs

  AnalysisQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "emip-analysis-queue-${Environment}"
      VisibilityTimeout: 660
      KmsMasterKeyId: alias/aws/sqs
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AnalysisDLQ.Arn
        maxReceiveCount: 3

  EventsBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub "emip-events-${Environment}"

  NotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "emip-notifications-${Environment}"

  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /emip/backend
      RetentionInDays: 30

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /emip/worker
      RetentionInDays: 30

  BackendFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "emip-backend-${Environment}"
      Handler: handler.handler
      CodeUri: ../backend/
      Description: EMIP backend API
      Timeout: 120
      ReservedConcurrentExecutions: 50
      Tracing: Active
      Layers:
        - !Ref DependenciesLayer
      Policies:
        - Statement:
            - Effect: Allow
              Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:ListBucket]
              Resource:
                - !Sub "arn:${AWS::Partition}:s3:::${ArtifactsBucket}"
                - !Sub "arn:${AWS::Partition}:s3:::${ArtifactsBucket}/*"
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:Scan]
              Resource:
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${JobsTable}"
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${JobsTable}/index/*"
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:Scan]
              Resource:
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AnalysisTable}"
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AnalysisTable}/index/*"
        - Statement:
            - Effect: Allow
              Action: [sqs:SendMessage]
              Resource: !GetAtt AnalysisQueue.Arn
        - Statement:
            - Effect: Allow
              Action: [cloudwatch:PutMetricData]
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action: [bedrock:Converse]
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action: [sns:Publish]
              Resource: !Ref NotificationTopic
        - Statement:
            - Effect: Allow
              Action: [events:PutEvents]
              Resource: !GetAtt EventsBus.Arn
        - Statement:
            - Effect: Allow
              Action: [xray:PutTraceSegments, xray:PutTelemetryRecords]
              Resource: "*"
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /{proxy+}
            Method: ANY
        RootEvent:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /
            Method: ANY

  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "emip-worker-${Environment}"
      Handler: worker_handler.handler
      CodeUri: ../backend/
      Description: EMIP async analysis/report worker
      MemorySize: 2048
      Timeout: 600
      ReservedConcurrentExecutions: 20
      Tracing: Active
      Layers:
        - !Ref DependenciesLayer
      Policies:
        - Statement:
            - Effect: Allow
              Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:ListBucket]
              Resource:
                - !Sub "arn:${AWS::Partition}:s3:::${ArtifactsBucket}"
                - !Sub "arn:${AWS::Partition}:s3:::${ArtifactsBucket}/*"
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:Scan]
              Resource:
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${JobsTable}"
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${JobsTable}/index/*"
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:Scan]
              Resource:
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AnalysisTable}"
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AnalysisTable}/index/*"
        - Statement:
            - Effect: Allow
              Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
              Resource: !GetAtt AnalysisQueue.Arn
        - Statement:
            - Effect: Allow
              Action: [sqs:SendMessage]
              Resource: !GetAtt AnalysisDLQ.Arn
        - Statement:
            - Effect: Allow
              Action: [cloudwatch:PutMetricData]
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action: [bedrock:Converse]
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action: [sns:Publish]
              Resource: !Ref NotificationTopic
        - Statement:
            - Effect: Allow
              Action: [events:PutEvents]
              Resource: !GetAtt EventsBus.Arn
        - Statement:
            - Effect: Allow
              Action: [xray:PutTraceSegments, xray:PutTelemetryRecords]
              Resource: "*"
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt AnalysisQueue.Arn
            BatchSize: 1
            MaximumBatchingWindowInSeconds: 5
