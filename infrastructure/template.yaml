AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: EMIP Backend — FastAPI + Worker Lambdas on SQS/EventBridge

Globals:
  Function:
    Timeout: 120
    MemorySize: 1024
    Runtime: python3.14
    Architectures:
      - x86_64
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        LOG_LEVEL: !Ref LogLevel
        S3_BUCKET: !Ref ArtifactsBucket
        DYNAMODB_JOBS_TABLE: !Ref JobsTable
        DYNAMODB_ANALYSIS_TABLE: !Ref AnalysisTable
        BEDROCK_MODEL_PRIMARY: "amazon.nova-pro-v1:0"
        BEDROCK_MODEL_FALLBACK: "amazon.nova-lite-v1:0"
        BEDROCK_MODEL_CODEGEN: "amazon.nova-pro-v1:0"
        SQS_ANALYSIS_QUEUE: !Ref AnalysisQueue
        SQS_ANALYSIS_DLQ: !Ref AnalysisDLQ
        SNS_NOTIFICATION_TOPIC: !Ref NotificationTopic
        EVENTBRIDGE_BUS_NAME: !Ref EventsBus
        CHECKPOINT_ENABLED: "true"
        ARTIFACT_VERSION: "1.0.0"
        CORS_ORIGINS: !Ref CorsOrigins
        EMIP_API_KEY: !Ref ApiKey

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [DEBUG, INFO, WARNING, ERROR]
  ApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: API key for authentication (empty = disabled)
  DynamoDBJobsTable:
    Type: String
    Default: emip-jobs-dev
  DynamoDBAnalysisTable:
    Type: String
    Default: emip-analysis-dev
  CorsOrigins:
    Type: String
    Default: "http://emip-frontend-479752407378.s3-website-us-east-1.amazonaws.com,http://localhost:5173,http://localhost:3000"
    Description: Comma-separated CORS origins (hosted frontend + localhost dev)
  NotificationEmail:
    Type: String
    Default: ""
    Description: Email address for pipeline notification subscriptions (empty = no subscription)

Conditions:
  ApiKeyNotConfigured: !Equals [!Ref ApiKey, ""]
  ApiKeyConfigured: !Not
    - Condition: ApiKeyNotConfigured
  NotificationEmailNotConfigured: !Equals [!Ref NotificationEmail, ""]
  NotificationEmailConfigured: !Not
    - Condition: NotificationEmailNotConfigured

Resources:
  # --- API Gateway ---
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "emip-api-${Environment}"
      StageName: !Ref Environment
      BinaryMediaTypes:
        - "*/*"
      # Preflight (OPTIONS) is answered by API Gateway. Actual responses carry
      # the Access-Control-Allow-Origin from the Lambda (FastAPI CORSMiddleware),
      # which is the authoritative per-origin gate for CORS_ORIGINS.
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-API-Key'"
        AllowOrigin: "'*'"
      TracingEnabled: true
      Auth:
        DefaultAuthorizer: NONE
      MethodSettings:
        - HttpMethod: "*"
          ResourcePath: "/*"
          LoggingLevel: INFO
          DataTraceEnabled: false
          MetricsEnabled: true

  # --- API Key + Usage Plan (only when an ApiKey parameter is provided) ---
  GatewayApiKey:
    Type: AWS::ApiGateway::ApiKey
    Condition: ApiKeyConfigured
    Properties:
      Description: EMIP API access key
      Enabled: true
      Value: !Ref ApiKey
      StageKeys:
        - RestApiId: !Ref ApiGateway
          StageName: !Ref Environment

  UsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Condition: ApiKeyConfigured
    Properties:
      Description: EMIP API usage plan
      ApiStages:
        - ApiId: !Ref ApiGateway
          Stage: !Ref Environment

  UsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Condition: ApiKeyConfigured
    Properties:
      KeyId: !Ref GatewayApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref UsagePlan

  # --- Lambda Layer ---
  DependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "emip-deps-${Environment}"
      ContentUri: ../layers/dependencies/
      CompatibleRuntimes:
        - python3.14
      Description: EMIP Python dependencies (FastAPI, Mangum, structlog, pydantic)

  # --- S3 Bucket ---
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "emip-artifacts-${Environment}-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: CleanupOldAnalysis
            Status: Enabled
            Transitions:
              - TransitionInDays: 30
                StorageClass: GLACIER

  # --- DynamoDB Tables ---
  JobsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref DynamoDBJobsTable
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH

  AnalysisTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref DynamoDBAnalysisTable
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
        - AttributeName: analysis_type
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
        - AttributeName: analysis_type
          KeyType: RANGE

  # --- SQS Queues ---
  AnalysisDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "emip-analysis-dlq-${Environment}"
      MessageRetentionPeriod: 1209600
      KmsMasterKeyId: alias/aws/sqs

  AnalysisQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "emip-analysis-queue-${Environment}"
      VisibilityTimeout: 660
      KmsMasterKeyId: alias/aws/sqs
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AnalysisDLQ.Arn
        maxReceiveCount: 3

  # --- EventBridge ---
  EventsBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub "emip-events-${Environment}"

  # --- SNS Topic ---
  NotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "emip-notifications-${Environment}"

  # Allow EventBridge (the custom bus) to publish pipeline events to SNS.
  NotificationTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref NotificationTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEventBridgeToPublish
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref NotificationTopic
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt EventsBus.Arn

  # Pipeline event rule: publish terminal + failure events to the SNS topic.
  PipelineEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "emip-pipeline-notifications-${Environment}"
      EventBusName: !Ref EventsBus
      EventPattern:
        source:
          - emip.pipeline
        detail-type:
          - pipeline.completed
          - pipeline.failed
          - pipeline.stage.failed
        detail:
          schema_version:
            - prefix: "1."
      Targets:
        - Arn: !Ref NotificationTopic
          Id: NotifyPipelineEvents

  # Email subscription (only when NotificationEmail is provided).
  NotificationEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: NotificationEmailConfigured
    Properties:
      TopicArn: !Ref NotificationTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  # --- CloudWatch Log Groups ---
  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /emip/backend
      RetentionInDays: 30

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /emip/worker
      RetentionInDays: 30

  # --- API Lambda Function ---
  BackendFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "emip-backend-${Environment}"
      Handler: handler.handler
      CodeUri: ../backend/
      Description: EMIP backend API
      MemorySize: 1024
      Timeout: 120
      ReservedConcurrentExecutions: 50
      Tracing: Active
      Layers:
        - !Ref DependenciesLayer
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:DeleteObject
                - s3:ListBucket
              Resource:
                - !Sub "arn:${AWS::Partition}:s3:::${ArtifactsBucket}"
                - !Sub "arn:${AWS::Partition}:s3:::${ArtifactsBucket}/*"
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${JobsTable}"
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${JobsTable}/index/*"
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AnalysisTable}"
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AnalysisTable}/index/*"
        - Statement:
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !GetAtt AnalysisQueue.Arn
        - Statement:
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:Converse
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.nova-pro-v1:0
                - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.nova-lite-v1:0
                - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.nova-micro-v1:0
        - Statement:
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref NotificationTopic
        - Statement:
            - Effect: Allow
              Action:
                - events:PutEvents
              Resource: !GetAtt EventsBus.Arn
        - Statement:
            - Effect: Allow
              Action:
                - xray:PutTraceSegments
                - xray:PutTelemetryRecords
              Resource: "*"
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /{proxy+}
            Method: ANY
        RootEvent:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /
            Method: ANY

  # --- Worker Lambda Function ---
  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "emip-worker-${Environment}"
      Handler: worker_handler.handler
      CodeUri: ../backend/
      Description: EMIP async analysis/report worker
      MemorySize: 2048
      Timeout: 600
      ReservedConcurrentExecutions: 20
      Tracing: Active
      Layers:
        - !Ref DependenciesLayer
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:DeleteObject
                - s3:ListBucket
              Resource:
                - !Sub "arn:${AWS::Partition}:s3:::${ArtifactsBucket}"
                - !Sub "arn:${AWS::Partition}:s3:::${ArtifactsBucket}/*"
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${JobsTable}"
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${JobsTable}/index/*"
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AnalysisTable}"
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AnalysisTable}/index/*"
        - Statement:
            - Effect: Allow
              Action:
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
              Resource: !GetAtt AnalysisQueue.Arn
        - Statement:
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !GetAtt AnalysisDLQ.Arn
        - Statement:
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:Converse
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.nova-pro-v1:0
                - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.nova-lite-v1:0
                - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.nova-micro-v1:0
        - Statement:
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref NotificationTopic
        - Statement:
            - Effect: Allow
              Action:
                - events:PutEvents
              Resource: !GetAtt EventsBus.Arn
        - Statement:
            - Effect: Allow
              Action:
                - xray:PutTraceSegments
                - xray:PutTelemetryRecords
              Resource: "*"
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt AnalysisQueue.Arn
            BatchSize: 1
            MaximumBatchingWindowInSeconds: 5

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
  FunctionArn:
    Description: Backend Lambda function ARN
    Value: !GetAtt BackendFunction.Arn
  WorkerFunctionArn:
    Description: Worker Lambda function ARN
    Value: !GetAtt WorkerFunction.Arn
  ArtifactsBucketName:
    Description: S3 bucket for artifacts
    Value: !Ref ArtifactsBucket
  JobsTableName:
    Description: DynamoDB jobs table
    Value: !Ref JobsTable
  AnalysisTableName:
    Description: DynamoDB analysis table
    Value: !Ref AnalysisTable
  AnalysisQueueUrl:
    Description: SQS analysis queue URL
    Value: !Ref AnalysisQueue
  AnalysisDLQUrl:
    Description: SQS analysis dead letter queue URL
    Value: !Ref AnalysisDLQ
  EventsBusName:
    Description: EventBridge bus name
    Value: !Ref EventsBus
  NotificationTopicArn:
    Description: SNS notification topic ARN
    Value: !Ref NotificationTopic
